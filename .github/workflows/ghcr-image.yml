name: Publish GHCR image (main)

# Builds the production image off the server so deploys only pull and restart.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ghcr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Resolve image name and version
        id: version
        run: |
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION="$(cat VERSION)-main-$(date +'%Y%m%d')-${SHORT_SHA}"
          echo "$VERSION" > VERSION
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The frontend and the Go binary are built on the runner, where
      # setup-go keeps the Go build cache between runs; Docker only packages
      # the binary (Dockerfile.prebuilt). The full Dockerfile stays the
      # reference build for everyone else.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Build frontend
        working-directory: web
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # Runners ship different 1.26.x patch releases; resolving the latest
          # one keeps the Go build cache key stable between runs.
          check-latest: true
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Build backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOWORK: 'off'
          GOEXPERIMENT: greenteagc
        run: |
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$(cat VERSION)'" -o new-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main publishes; a manual run on another branch checks the build.
      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.prebuilt
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.short_sha }}
          cache-from: type=gha,scope=prebuilt
          cache-to: type=gha,scope=prebuilt,mode=min

      - name: Output tags
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.short_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
